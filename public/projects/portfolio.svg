<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="portfolioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10ac84;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
    <filter id="portfolioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#portfolioGradient)"/>
  
  <!-- Background pattern -->
  <defs>
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Main content -->
  <g filter="url(#portfolioShadow)">
    <text x="200" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Portfolio</text>
    <text x="200" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.9">Astro.js + Tailwind CSS</text>
  </g>
  
  <!-- Browser mockup -->
  <g transform="translate(100, 170)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="white" opacity="0.9"/>
    <rect x="0" y="0" width="200" height="25" rx="8" fill="white"/>
    <circle cx="15" cy="12.5" r="4" fill="#ff5f57"/>
    <circle cx="35" cy="12.5" r="4" fill="#ffbd2e"/>
    <circle cx="55" cy="12.5" r="4" fill="#28ca42"/>
    
    <!-- Content lines -->
    <rect x="15" y="40" width="170" height="8" rx="2" fill="#10ac84" opacity="0.3"/>
    <rect x="15" y="55" width="120" height="6" rx="2" fill="#10ac84" opacity="0.2"/>
    <rect x="15" y="68" width="140" height="6" rx="2" fill="#10ac84" opacity="0.2"/>
    <rect x="15" y="85" width="80" height="20" rx="4" fill="#10ac84" opacity="0.4"/>
  </g>
  
  <!-- Code brackets -->
  <g opacity="0.6">
    <text x="50" y="80" fill="white" font-family="monospace" font-size="24" font-weight="bold">&lt;/&gt;</text>
    <text x="320" y="250" fill="white" font-family="monospace" font-size="24" font-weight="bold">&lt;/&gt;</text>
  </g>
</svg>