<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Background pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="white" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#dots)"/>
  
  <!-- Main content -->
  <g filter="url(#shadow)">
    <text x="200" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Em Breve</text>
    <text x="200" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.9">Novo projeto em desenvolvimento</text>
  </g>
  
  <!-- Loading animation -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="white" opacity="0.8"/>
    
    <!-- Rotating dots -->
    <g opacity="0.7">
      <circle cx="20" cy="0" r="3" fill="white">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-20" cy="0" r="3" fill="white">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="20" r="3" fill="white">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-20" r="3" fill="white">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.6">Aguarde novidades...</text>
</svg>